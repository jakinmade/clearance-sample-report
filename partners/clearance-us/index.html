<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEARANCE for US partners</title>
<meta name="description" content="See a sample report, run a free check and download the result, then talk to us about offering it to your clients under your brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#B8862A; --accent-ink:#8A6118; --dark:#0B1929; --soft:#F8F4EA;
  --paper:#F6F7F8; --card:#fff; --line:#DCE1E6; --ink:#16212E; --muted:#56616F;
  --red:#B42318; --red-bg:#FDECEA; --amber:#9A4A06; --amber-bg:#FEF3E2; --green:#18744F; --green-bg:#E7F5EE;
  --r-lg:14px; --r-sm:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

header.top{background:var(--dark);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{font-weight:700;font-size:19px;letter-spacing:.06em}
.brand small{font-weight:500;letter-spacing:0;font-size:14px;color:#B9C4CF;margin-left:10px}
.yourbrand{font-size:13px;color:#D6DEE6;border:1px dashed #5D6B7A;border-radius:8px;padding:6px 12px}

.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;padding:56px 0 36px;align-items:start}
h1{font-size:clamp(32px,4.2vw,48px);line-height:1.07;letter-spacing:-.025em;margin:0 0 18px;color:var(--dark);font-weight:600;max-width:17ch}
.lede{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:50ch}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px}
.steps li a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-weight:600;font-size:15px;line-height:1.35}
.steps li a:hover{border-color:var(--accent)}
.steps b{display:block;color:var(--accent-ink);font-size:13px;font-weight:600;margin-bottom:2px}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.facts li{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.facts .n{font-size:24px;font-weight:600;color:var(--accent-ink);letter-spacing:-.02em}
.facts p{margin:0;font-size:15px}
.facts cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}

section.block{padding:52px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(24px,2.8vw,32px);letter-spacing:-.02em;color:var(--dark);margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin:0 0 28px;max-width:62ch}
.kicker{color:var(--accent-ink);font-weight:600;font-size:14px;margin:0 0 6px}

.sample{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thumbs img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.thumbs img:first-child{grid-column:1 / -1;max-height:420px;object-fit:cover;object-position:top}
.anatomy{list-style:none;margin:0 0 22px;padding:0;counter-reset:a}
.anatomy li{counter-increment:a;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.anatomy li:first-child{border-top:0}
.anatomy li::before{content:counter(a);width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px}
.anatomy h3{margin:0 0 2px;font-size:16px;color:var(--dark)}
.anatomy p{margin:0;font-size:15px;color:var(--muted)}

.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r-sm);padding:13px 18px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:inline-block;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.dark:hover{opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.trywrap{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:start}
.check{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 18px 40px -26px rgba(0,0,0,.35);overflow:hidden}
.check-head{padding:20px 24px 0}
.step-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.progress{height:4px;background:#E8ECEF;border-radius:4px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.check-body{padding:20px 24px 24px;min-height:320px;display:flex;flex-direction:column}
.q{font-size:20px;line-height:1.35;font-weight:600;color:var(--dark);margin:0 0 10px}
.hint{font-size:14.5px;color:var(--muted);margin:0 0 20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.sectors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sectors .btn{text-align:left;font-weight:500;padding:11px 14px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:auto}
.scale .btn{padding:12px 0;font-variant-numeric:tabular-nums}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0;margin-top:12px;align-self:flex-start}
.back:hover{color:var(--ink)}
.side-note{font-size:15px;color:var(--muted)}
.side-note ul{padding-left:18px;margin:8px 0 0}

#result{display:none;margin-top:32px}
#result.on{display:block}
.verdict{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.verdict h3{font-size:clamp(24px,3vw,34px);line-height:1.12;letter-spacing:-.02em;margin:0 0 10px;color:var(--dark);font-weight:600}
.verdict p{margin:0;color:var(--muted);max-width:60ch}
.sev-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sev{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.sev.critical,.sev.esc{background:var(--red-bg);color:var(--red)}
.sev.high,.sev.flag{background:var(--amber-bg);color:var(--amber)}
.sev.clear,.sev.pass{background:var(--green-bg);color:var(--green)}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:32px;align-items:start}
.ledger{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 18px}
.ledger h4{font-size:15px;margin:14px 0 6px;color:var(--dark)}
.ledger ul{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.ledger li:first-child{border-top:0}
.tag{font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;align-self:start}
.tag.yes{background:var(--green-bg);color:var(--green)}
.tag.no{background:var(--red-bg);color:var(--red)}
.tag.mid{background:var(--amber-bg);color:var(--amber)}
.tag.info{background:#EEF1F4;color:var(--muted)}
.gap{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--r-sm);padding:20px 22px;margin-bottom:14px}
.gap.critical,.gap.esc{border-left-color:var(--red)}
.gap.pass{border-left-color:var(--green)}
.gap-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:4px}
.gap h4{font-size:18px;margin:0;color:var(--dark)}
.gap .sevword{font-size:13px;font-weight:600;color:var(--amber);white-space:nowrap}
.gap.critical .sevword,.gap.esc .sevword{color:var(--red)}
.gap.pass .sevword{color:var(--green)}
.gap .pain{margin:6px 0 12px}
.gap dl{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;margin:0;font-size:14.5px}
.gap dt{color:var(--muted)}
.gap dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#EEF1F4;color:var(--ink);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:500}
.note{background:var(--soft);border-radius:var(--r-sm);padding:14px 18px;font-size:14.5px;margin:0 0 14px}
.dl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-top:22px}
.dl h4{flex:1 1 100%;margin:0;font-size:17px;color:var(--dark)}
.dl p{flex:1 1 100%;margin:-6px 0 2px;font-size:14px;color:var(--muted)}
.dl input{flex:1 1 220px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font:inherit;min-width:0}

.partner{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
.points{list-style:none;margin:0;padding:0}
.points li{padding:14px 0;border-top:1px solid var(--line)}
.points li:first-child{border-top:0;padding-top:0}
.points h3{margin:0 0 2px;font-size:16px;color:var(--dark)}
.points p{margin:0;color:var(--muted);font-size:15px}
.cta{background:var(--dark);color:#D9E1E8;border-radius:var(--r-lg);padding:28px}
.cta h3{color:#fff;font-size:22px;margin:0 0 8px;font-weight:600}
.cta p{margin:0 0 18px;font-size:15px}
.cta .btn{width:100%;margin-bottom:10px}
.cta .btn.ghost{background:transparent;border-color:#4C5B6B;color:#fff}
.cta .price{font-size:13.5px;color:#AEBBC8;margin:6px 0 0}

footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 8px;max-width:92ch}

#rpt{position:fixed;left:-10000px;top:0}
.rpt{width:794px;background:#fff;color:#16212E;font:13px/1.55 "Instrument Sans",Arial,sans-serif}
.rpt .rh{background:#0B1929;color:#fff;padding:28px 36px}
.rpt .rh .b{font-size:14px;font-weight:700;letter-spacing:.06em;color:#fff}
.rpt .rh h1{color:#fff;font-size:26px;margin:8px 0 4px;max-width:none;line-height:1.15}
.rpt .rh .m{color:#C3CDD7;font-size:12px}
.rpt .rb{padding:22px 36px}
.rpt h2{font-size:18px;color:#0B1929;margin:0 0 6px}
.rpt table{width:100%;border-collapse:collapse;margin:10px 0 18px}
.rpt td{border-top:1px solid #DCE1E6;padding:7px 0;vertical-align:top}
.rpt td.r{text-align:right;font-weight:600;white-space:nowrap}
.rpt .g{border:1px solid #DCE1E6;border-left:4px solid #9A4A06;border-radius:6px;padding:12px 16px;margin:0 0 10px;page-break-inside:avoid}
.rpt .g.c{border-left-color:#B42318}
.rpt .g.p{border-left-color:#18744F}
.rpt .g h3{margin:0 0 4px;font-size:15px;color:#0B1929}
.rpt .g p{margin:0 0 6px}
.rpt .k{color:#56616F}
.rpt .f{border-top:1px solid #DCE1E6;margin-top:16px;padding-top:10px;font-size:11px;color:#56616F}

@media (max-width:900px){
  .hero,.sample,.trywrap,.partner,.verdict,.grid2{grid-template-columns:1fr}
  .hero{gap:28px;padding-top:36px}
  .sev-row{justify-content:flex-start}
}
@media (max-width:540px){
  .wrap{padding:0 16px}
  .steps{grid-template-columns:1fr}
  .sectors{grid-template-columns:1fr}
  .yourbrand{display:none}
  .check-head,.check-body{padding-left:16px;padding-right:16px}
  .scale{grid-template-columns:repeat(5,1fr)}
  .gap{padding:16px}
  .gap dl{grid-template-columns:1fr;gap:2px}
  .gap dd{margin-bottom:8px}
  .facts li{grid-template-columns:70px 1fr}
}
@media print{body>*:not(#rpt){display:none!important}#rpt{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      function done(){ btn.textContent = label; btn.disabled = false; }
      if(!ok){ done(); window.print(); return; }
      window.html2pdf().set({margin:[8,0,10,0], filename:C.product+"-free-check-result.pdf",
        image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0},
        jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","avoid-all"]}}).from(html).save().then(done,done);
    });
  }

  function restart(){
    state = {step:-1, sector:null, answers:{}}; result.className=""; result.innerHTML="";
    renderSector(); document.getElementById("try").scrollIntoView({behavior:"auto"});
  }
  window.__aqeScoreFor = function(vals){ state.answers = {}; Q.forEach(function(q,i){ state.answers[q.id] = vals[i]; }); return aqeScore(); };
  renderSector();
})();
</script>
